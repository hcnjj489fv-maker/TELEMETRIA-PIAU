<style>
:root{
  --navy:#031244; --navy2:#0B2A6F; --laranja:#FFA02B; --laranja2:#F26A1B; --claro:#C9D6F2;
  --vidro:rgba(255,255,255,.10); --borda:rgba(255,255,255,.22);
  --ok:#5EEAD4; --alerta:#FFB84D; --erro:#FF6B6B; --info:#7DB3FF;
}
*{box-sizing:border-box}
html{color-scheme:dark; background:#031244}
body{
  margin:0; min-height:100vh; color:#fff; font:14px/1.45 "Segoe UI",Arial,Helvetica,sans-serif;
  background:
    radial-gradient(900px 520px at 100% 0%, rgba(242,106,27,.38), transparent 62%),
    radial-gradient(1000px 640px at 100% 100%, rgba(255,160,43,.26), transparent 62%),
    radial-gradient(700px 500px at 0% 100%, rgba(242,106,27,.14), transparent 60%),
    linear-gradient(160deg,#031244 0%,#0B2A6F 68%,#0a2358 100%);
}
.pagina{max-width:1760px; margin:0 auto; padding:20px 24px 48px; display:grid; grid-template-columns:292px minmax(0,1fr); gap:18px; align-items:start}
.principal{min-width:0}
.glass{
  background:var(--vidro); border:1px solid var(--borda); border-radius:18px;
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  box-shadow:0 10px 30px rgba(3,18,68,.28);
}
/* ---------- cabeçalho ---------- */
.topo{display:flex; align-items:center; gap:22px; padding:14px 22px; margin-bottom:14px}
.topo img.logo{height:62px; width:auto; display:block}
.topo .titulos{flex:1; min-width:0}

.selos{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end}

/* ---------- avisos ---------- */

/* ---------- filtros ---------- */
.filtros{display:flex; flex-wrap:wrap; gap:14px 18px; align-items:flex-end; padding:14px 18px; margin-bottom:14px}
.campo{display:flex; flex-direction:column; gap:4px}

}

/* ---------- tabelas ---------- */

.tag.rod{background:rgba(255,160,43,.18); color:var(--laranja); border-color:rgba(255,160,43,.5)}
.tag.par{background:rgba(148,163,184,.22); color:#DCE5F5; border-color:rgba(148,163,184,.5)}
.tag.alerta{background:rgba(255,184,77,.18); color:var(--alerta); border-color:rgba(255,184,77,.5)}
.tag.erro{background:rgba(255,107,107,.18); color:#FFB3B3; border-color:rgba(255,107,107,.55)}
.tag.info{background:rgba(125,179,255,.16); color:var(--info); border-color:rgba(125,179,255,.45)}

.pager{display:flex; gap:8px; align-items:center; justify-content:flex-end; margin-top:10px; font-size:12.5px; color:var(--claro)}

button.exporta{background:rgba(255,160,43,.18); color:var(--laranja); border:1px solid rgba(255,160,43,.55); border-radius:10px; padding:7px 13px; font:inherit; font-size:12.5px; font-weight:700; cursor:pointer}

.bloco-notas{font-size:13px; color:var(--claro)} .bloco-notas li{margin:5px 0} .bloco-notas b{color:#fff}
.mini{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px}

/* barras horizontais */
.hb{display:grid; grid-template-columns:minmax(120px,38%) 1fr auto; gap:10px; align-items:center; margin:9px 0}
.hb-l{font-size:13px; overflow:hidden; text-overflow:ellipsis} .hb-l small{display:block; color:var(--claro); font-size:11px; overflow:hidden; text-overflow:ellipsis}
.hb-b{height:16px; background:rgba(255,255,255,.08); border-radius:8px; overflow:hidden} .hb-b div{height:100%; border-radius:8px}
.hb-v{font-weight:800; font-size:13px; min-width:64px; text-align:right}
#tip{position:fixed; z-index:50; pointer-events:none; max-width:340px; background:rgba(3,18,68,.96); color:#fff; border:1px solid var(--laranja); border-radius:10px; padding:8px 11px; font-size:12px; line-height:1.4; display:none; box-shadow:0 8px 24px rgba(0,0,0,.4)}

@media (max-width:560px){.campo,.campo select,.campo input{width:100%; min-width:0} .pagina{padding:12px 12px 40px} .topo img.logo{height:48px} .topo h1{font-size:18px}}

/* ---------- barra lateral de filtros ---------- */
.lateral{position:sticky; top:16px; max-height:calc(100vh - 32px); overflow-y:auto; padding:16px 16px 14px}

.duas{display:grid; grid-template-columns:1fr 1fr; gap:8px}

.op:hover{background:rgba(255,160,43,.14)}
.op.on{background:rgba(255,160,43,.22); border-color:var(--laranja)}
.op input{accent-color:#FFA02B; width:15px; height:15px; margin:0; flex:none}

.op .tx small{font-size:10.5px; color:var(--claro); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.op em{font-style:normal; font-size:10px; color:var(--claro); border:1px dashed rgba(255,255,255,.35); border-radius:999px; padding:0 6px; white-space:nowrap}

.chip-dia{background:rgba(255,160,43,.22); color:#fff; border:1px solid var(--laranja); border-radius:999px; padding:4px 10px; font:inherit; font-size:12px; cursor:pointer}
.chip-dia:hover{background:rgba(255,107,107,.3)}
button.btn-pdf{width:100%; margin-top:6px; padding:12px 14px; border:0; border-radius:12px; cursor:pointer; font:inherit; font-weight:800; color:#031244; background:linear-gradient(135deg,var(--laranja2),var(--laranja)); box-shadow:0 6px 18px rgba(242,106,27,.35)}

.dica-lat{font-size:11.5px; color:var(--claro); margin-top:8px}

.mut{color:var(--claro); font-size:12px}
.pl{font-size:11px; color:var(--claro); font-weight:600; margin-left:3px}
.sv{color:var(--claro); font-size:11.5px; margin-left:4px}
.dica-clique{font-size:12.5px; color:var(--claro); margin:0 0 12px; padding:9px 14px; border-radius:12px; background:rgba(255,160,43,.10); border:1px solid rgba(255,160,43,.35)}
.dica-clique b{color:#fff}
/* ---------- interação (filtro cruzado) ---------- */
.dim{opacity:.28}
[data-dim]{cursor:pointer}
.hb{padding:3px 6px; margin:4px -6px; border-radius:10px}
.hb:hover{background:rgba(255,255,255,.07)}

.mapa .r.sel,.mapa .d.sel{outline:2px solid var(--laranja); border-radius:6px}

svg .hit:hover{fill:rgba(255,255,255,.08)}
tbody tr.clicavel{cursor:pointer}

.kpis{grid-template-columns:repeat(5,minmax(0,1fr))}

/* ---------- relatório PDF ---------- */
.rel{display:none}
.rel.medindo{display:block; position:absolute; left:-12000px; top:0; width:297mm}
.rel .pg{width:297mm; height:209mm; padding:7mm 8mm; overflow:hidden; box-sizing:border-box; position:relative; color:#fff; font-size:12px;
  background:radial-gradient(800px 460px at 100% 0%, rgba(242,106,27,.38), transparent 62%),radial-gradient(900px 560px at 100% 100%, rgba(255,160,43,.24), transparent 62%),linear-gradient(160deg,#031244 0%,#0B2A6F 70%,#0a2358 100%)}

.r-topo{display:flex; align-items:center; gap:16px; margin-bottom:6px}

.r-filtros{display:flex; flex-wrap:wrap; gap:3px 18px; padding:6px 12px; margin-bottom:7px; border-radius:10px; font-size:11px; background:rgba(255,160,43,.12); border:1px solid rgba(255,160,43,.45)}
.r-filtros b{color:var(--laranja)}
.rel .kpis{grid-template-columns:repeat(5,1fr); gap:7px; margin-bottom:7px}
.rel .kpi{min-height:0; padding:9px 11px 7px; cursor:default}
.rel .kpi .val{font-size:20px; margin:2px 0 0} .rel .kpi .val small{font-size:11px} .rel .kpi .rot{font-size:9.5px} .rel .kpi .sub{font-size:10px}
.rel .grade{gap:8px; margin-bottom:8px}
.rel .g21{grid-template-columns:2fr 1fr!important} .rel .painel{padding:9px 12px; margin-bottom:8px}
.rel .grade .painel{margin-bottom:0}
.rel .painel h2{font-size:12px} .rel .painel .dica{font-size:10px; margin-bottom:4px}
.rel .hb{margin:5px 0} .rel .hb-l{font-size:11.5px} .rel .hb-v{font-size:11.5px}
.rel .mapa{overflow:visible} .rel .mapa .c{height:21px; min-width:0} .rel .mapa .r{font-size:11px; position:static}
.rel .leg-mapa{font-size:10px; margin-bottom:6px}
.rel .legenda{font-size:10.5px}
.rel table.est{width:100%; font-size:10.5px; border-collapse:collapse}

.rel table.est td{padding:4px 7px; white-space:normal; border-top:1px solid rgba(255,255,255,.12)}
.r-rod{position:absolute; left:8mm; right:8mm; bottom:4mm; text-align:center; font-size:9.5px; color:var(--claro)}
@page{size:A4 landscape; margin:0}
@media print{
  html,body{background:#031244!important; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  #app,#tip{display:none!important}
  .rel{display:block; position:static; width:297mm}
  .rel .pg{page-break-after:always; break-after:page; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  .rel .pg:last-child{page-break-after:auto; break-after:auto}
  .rel *{-webkit-print-color-adjust:exact; print-color-adjust:exact}
}

<script type="text/plain" id="appjs">
/* Dashboard de Controle de Veículos e Motoristas - PIAU
   Lê window.FROTA_DADOS (gerado por atualizar.py). Sem bibliotecas externas: funciona offline. */
(function () {
'use strict';
const APP = document.getElementById('app');
const D = window.FROTA_DADOS;

/* ============================================================ utilidades */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf0 = new Intl.NumberFormat('pt-BR', {maximumFractionDigits: 0});
const nf1 = new Intl.NumberFormat('pt-BR', {minimumFractionDigits: 1, maximumFractionDigits: 1});
const n0 = v => v == null ? '—' : nf0.format(v);
const n1 = v => v == null ? '—' : nf1.format(v);
const p2 = n => String(n).padStart(2, '0');
const dBR = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : '';
const dCurta = iso => iso.slice(8, 10) + '/' + iso.slice(5, 7);
const hHM = ts => ts ? ts.slice(11, 16) : '';
const dtBR = ts => ts ? dBR(ts) + ' ' + ts.slice(11, 19) : '';
const toUTC = iso => Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10));
const fromUTC = ms => { const d = new Date(ms); return d.getUTCFullYear() + '-' + p2(d.getUTCMonth() + 1) + '-' + p2(d.getUTCDate()); };
const addDias = (iso, n) => fromUTC(toUTC(iso) + n * 864e5);
const DOW = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const dow = iso => DOW[new Date(toUTC(iso)).getUTCDay()];
const intervalo = (a, b) => { const r = []; for (let ms = toUTC(a); ms <= toUTC(b); ms += 864e5) r.push(fromUTC(ms)); return r; };
const minutos = (a, b) => Math.round((new Date(b.replace(' ', 'T')) - new Date(a.replace(' ', 'T'))) / 60000);
const durHM = m => m == null ? '' : (m >= 60 ? Math.floor(m / 60) + 'h' + p2(m % 60) : m + ' min');
const soma = (arr, f) => arr.reduce((s, x) => s + (f(x) || 0), 0);

if (!D) {
  APP.innerHTML = '<div class="glass vazio" style="margin-top:60px"><h2>Nenhum dado carregado ainda</h2>' +
    '<p>Execute o arquivo <b>ATUALIZAR_E_ABRIR.bat</b> (Windows) para ler os PDFs da pasta <b>pdf_veiculos</b> e gerar o painel.</p></div>';
  return;
}

const NAO = D.nao_identificado;
const LIM = D.config.limite_velocidade_kmh;
const CORES = ['#FFA02B', '#4C8DFF', '#2DD4BF', '#A78BFA', '#F472B6', '#FACC15', '#4ADE80', '#FB7185', '#38BDF8', '#F97316'];
const corVeic = {}; D.veiculos.forEach((v, i) => { corVeic[v.placa] = CORES[i % CORES.length]; });
const info = {}; D.veiculos.forEach(v => { info[v.placa] = v; });
const temApel = p => !!(info[p] && info[p].apelido);
const apel = p => temApel(p) ? info[p].apelido : p;
const subVeic = p => { const v = info[p] || {}; return temApel(p) ? p + (v.modelo ? ' · ' + v.modelo : '') : (v.nome || v.modelo || ''); };
const modVeic = p => (info[p] && (info[p].modelo || info[p].nome)) || '';
const hVeic = p => '<b>' + esc(apel(p)) + '</b>' + (temApel(p) ? ' <span class="pl">' + esc(p) + '</span>' : '');
const txtVeic = p => temApel(p) ? info[p].apelido + ' (' + p + ')' : p;
const comDados = p => !!(info[p] && info[p].com_dados);
const motDe = t => t.motorista || NAO;
const tagMot = m => m === NAO ? '<span class="tag nid">' + esc(NAO) + '</span>' : esc(m);

/* período total dos dados */
const todasDatas = [];
D.percursos.forEach(t => todasDatas.push(t.data));
D.excessos.forEach(e => todasDatas.push(e.data));
Object.values(D.cobertura).forEach(l => l.forEach(c => { todasDatas.push(c.ini); todasDatas.push(c.fim); }));
todasDatas.sort();
const DATA_MIN = todasDatas[0] || null, DATA_MAX = todasDatas[todasDatas.length - 1] || null;

/* cobertura (dias com relatório) por veículo */
const cobSet = {};
const velMinDia = (placa, d) => { const c = (D.cobertura[placa] || []).filter(c => c.ini <= d && d <= c.fim); return c.length ? Math.min.apply(null, c.map(x => x.vel_min == null ? 1e9 : x.vel_min)) : null; };
D.veiculos.forEach(v => {
  const s = new Set();
  (D.cobertura[v.placa] || []).forEach(c => intervalo(c.ini, c.fim).forEach(d => s.add(d)));
  D.percursos.filter(t => t.placa === v.placa).forEach(t => s.add(t.data));
  cobSet[v.placa] = s;
});


/* ============================================================ estado e cálculo */
/* Filtros no estilo Power BI: conjuntos (vazio = todos). Clique alterna; Ctrl/Shift+clique soma à seleção. */
const S = {placas: new Set(), mots: new Set(), dias: new Set(), ini: DATA_MIN, fim: DATA_MAX, aba: 'geral', diasMostrar: 'todos'};
const motoristas = Array.from(new Set(D.percursos.map(motDe))).sort((a, b) => a === NAO ? 1 : b === NAO ? -1 : a.localeCompare(b, 'pt-BR'));
const nFiltros = () => S.placas.size + S.mots.size + S.dias.size;
let EST = false; /* true = gráficos do relatório PDF (sem interação) */
const dv = (dim, val) => EST ? '' : ' data-dim="' + dim + '" data-val="' + esc(val) + '"';
const cl = (dim, val) => { if (EST) return ''; const st = S[dim]; return st.size ? (st.has(val) ? 'sel' : 'dim') : ''; };
const clCel = (p, d) => { if (EST || (!S.placas.size && !S.dias.size)) return ''; return (!S.placas.size || S.placas.has(p)) && (!S.dias.size || S.dias.has(d)) ? 'sel' : 'dim'; };

/* calc(excl): aplica todos os filtros, menos as dimensões listadas em excl ('placas','mots','dias').
   Assim o gráfico clicado continua mostrando as demais opções (destacando a escolhida), como no Power BI. */
function calc(excl) {
  excl = excl || [];
  const uP = !excl.includes('placas') && S.placas.size > 0, uM = !excl.includes('mots') && S.mots.size > 0, uD = !excl.includes('dias') && S.dias.size > 0;
  const okT = x => (!uP || S.placas.has(x.placa)) && (!uM || S.mots.has(motDe(x))) && (!uD || S.dias.has(x.data)) && x.data >= S.ini && x.data <= S.fim;
  const trips = D.percursos.filter(okT);
  const exc = D.excessos.filter(okT);
  const placas = D.veiculos.map(v => v.placa).filter(p => !uP || S.placas.has(p));
  const incons = D.inconsistencias.filter(i => (!uP || S.placas.has(i.placa)) && (!i.data || (i.data >= S.ini && i.data <= S.fim && (!uD || S.dias.has(i.data)))));

  const porDia = new Map();
  trips.forEach(t => { const k = t.placa + '|' + t.data; if (!porDia.has(k)) porDia.set(k, []); porDia.get(k).push(t); });
  const dias = [];
  const listaDias = (S.ini && S.fim ? intervalo(S.ini, S.fim) : []).filter(d => !uD || S.dias.has(d));
  placas.forEach(p => {
    listaDias.forEach(d => {
      const ts = porDia.get(p + '|' + d);
      if (ts) {
        const comOdo = ts.filter(t => t.odo_ini != null), comFim = ts.filter(t => t.odo_fim != null);
        const n = soma(ts, t => t.n);
        dias.push({placa: p, data: d, situacao: 'rodou', trips: ts.length,
          mots: Array.from(new Set(ts.map(motDe))), ini: ts[0].ini, fim: ts[ts.length - 1].fim,
          odo_ini: comOdo.length ? comOdo[0].odo_ini : null, odo_fim: comFim.length ? comFim[comFim.length - 1].odo_fim : null,
          km: soma(ts, t => t.km), km_nulo: ts.some(t => t.km == null),
          vel_med: n ? soma(ts, t => t.soma_vel) / n : null, vel_max: Math.max.apply(null, ts.map(t => t.vel_max)),
          exc: soma(ts, t => t.n_exc), n: n});
      } else if (!uM && cobSet[p].has(d)) {
        dias.push({placa: p, data: d, situacao: 'parado', trips: 0, mots: [], km: 0});
      }
    });
  });

  const novoG = nome => ({nome: nome, km: 0, trips: 0, soma: 0, n: 0, vmax: 0, excT: 0, diasSet: new Set(), veic: new Set(), mots: new Set(), kmNulo: 0});
  const grupo = (lista, chave) => {
    const m = new Map();
    lista.forEach(t => {
      const k = chave(t);
      if (!m.has(k)) m.set(k, novoG(k));
      const g = m.get(k);
      g.km += t.km || 0; g.trips++; g.soma += t.soma_vel; g.n += t.n; g.vmax = Math.max(g.vmax, t.vel_max || 0);
      g.excT += t.n_exc; g.diasSet.add(t.placa + '|' + t.data); g.veic.add(t.placa); g.mots.add(motDe(t)); if (t.km == null) g.kmNulo++;
    });
    return m;
  };
  const porVeic = grupo(trips, t => t.placa), porMot = grupo(trips, motDe);
  exc.forEach(e => {
    [porVeic.get(e.placa), porMot.get(motDe(e))].forEach(g => { if (g) g.exc = (g.exc || 0) + 1; });
  });
  placas.forEach(p => { if (!porVeic.has(p)) porVeic.set(p, novoG(p)); });
  const diasRod = dias.filter(d => d.situacao === 'rodou'), diasPar = dias.filter(d => d.situacao === 'parado');
  return {trips, exc, placas, incons, dias, diasRod, diasPar, porVeic, porMot, uM: uM,
    km: soma(trips, t => t.km), nVel: soma(trips, t => t.n), somaVel: soma(trips, t => t.soma_vel)};
}
function alterna(set, val, multi) {
  if (multi) { if (set.has(val)) set.delete(val); else set.add(val); }
  else if (set.size === 1 && set.has(val)) set.clear();
  else { set.clear(); set.add(val); }
}

const TIP = document.getElementById('tip');
document.addEventListener('mouseover', e => {
  const t = e.target.closest('[data-tip]');
  if (!t) { TIP.style.display = 'none'; return; }
  TIP.innerHTML = t.getAttribute('data-tip'); TIP.style.display = 'block';
});
document.addEventListener('mousemove', e => {

/* ============================================================ gráficos (SVG) */
function escala(max) {
  if (!(max > 0)) return {max: 1, step: .25, n: 4};
  const raw = max / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), nr = raw / mag;
  const step = (nr <= 1 ? 1 : nr <= 2 ? 2 : nr <= 2.5 ? 2.5 : nr <= 5 ? 5 : 10) * mag;
  const top = Math.ceil(max / step - 1e-9) * step;
  return {max: top, step: step, n: Math.round(top / step)};
}
const SVG_TXT = 'fill="#C9D6F2" font-size="11" font-family="Segoe UI,Arial,sans-serif"';

function eixoY(esc_, m, W, H, fmt) {
  let s = '';
  for (let i = 0; i <= esc_.n; i++) {
    const v = i * esc_.step, y = m.t + (H - m.t - m.b) * (1 - v / esc_.max);
    s += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="rgba(255,255,255,' + (i === 0 ? .35 : .12) + ')"/>';
    s += '<text x="' + (m.l - 7) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end" ' + SVG_TXT + '>' + fmt(v) + '</text>';
  }
  return s;
}
function rotulosX(cats, m, W, H, passoMin) {
  const area = W - m.l - m.r, bw = area / cats.length;
  const cada = Math.max(1, Math.ceil(passoMin / bw));
  let s = '';
  cats.forEach((c, i) => {
    if (i % cada) return;
    s += '<text x="' + (m.l + bw * (i + .5)).toFixed(1) + '" y="' + (H - m.b + 15) + '" text-anchor="middle" ' + SVG_TXT + '>' + c.l + '</text>';
  });
  return s;
}


function graficoBarras(el, cats, series, opt) {
  const W = Math.max(320, el.clientWidth), H = opt.h || 290, m = {l: 48, r: 8, t: 10, b: 30};
  const tot = cats.map((c, i) => soma(series, s => s.v[i]));
  const sc = escala(Math.max.apply(null, tot.concat([0])));
  const area = W - m.l - m.r, bw = area / cats.length, bar = Math.max(2, Math.min(34, bw * .74)), ph = H - m.t - m.b;
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="' + esc(opt.titulo) + '">';
  s += eixoY(sc, m, W, H, v => nf0.format(v)) + rotulosX(cats, m, W, H, 42);
  cats.forEach((c, i) => {
    let acum = 0;
    const x = m.l + bw * i + (bw - bar) / 2, cd = cl('dias', c.k);
    const linhas = series.filter(se => se.v[i] > 0).map(se => '<b style="color:' + se.cor + '">■</b> ' + esc(se.nome) + ': ' + n0(se.v[i]) + ' km').join('<br>');
    const tip = ('<b>' + dBR(c.k) + ' (' + dow(c.k) + ')</b><br>' + (linhas || 'Sem percursos') + (tot[i] > 0 && series.filter(se => se.v[i] > 0).length > 1 ? '<br><b>Total: ' + n0(tot[i]) + ' km</b>' : '')).replace(/"/g, '&quot;');
    if (!EST) s += '<rect class="hit" x="' + (m.l + bw * i).toFixed(1) + '" y="' + m.t + '" width="' + bw.toFixed(1) + '" height="' + ph + '" fill="transparent"' + dv('dias', c.k) + ' data-tip="' + tip + '"/>';
    series.forEach(se => {
      const v = se.v[i]; if (!(v > 0)) return;
      const h = ph * v / sc.max, y = m.t + ph * (1 - (acum + v) / sc.max);
      s += '<rect class="' + cd + '" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bar.toFixed(1) + '" height="' + Math.max(1, h).toFixed(1) +
        '" rx="2" fill="' + se.cor + '"' + dv('dias', c.k) + ' data-tip="' + tip + '"/>';
      acum += v;
    });
  });
  el.innerHTML = s + '</svg>';
}

function graficoLinhas(el, cats, series, limite, opt) {
  const W = Math.max(320, el.clientWidth), H = opt.h || 290, m = {l: 48, r: 8, t: 12, b: 30};
  const max = Math.max.apply(null, series.reduce((a, s) => a.concat(s.pts.map(p => p.v)), [limite, 1]));
  const sc = escala(max * 1.05);
  const area = W - m.l - m.r, bw = area / cats.length, ph = H - m.t - m.b;
  const X = i => m.l + bw * (i + .5), Y = v => m.t + ph * (1 - v / sc.max);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="' + esc(opt.titulo) + '">';
  s += eixoY(sc, m, W, H, v => nf0.format(v)) + rotulosX(cats, m, W, H, 42);
  if (!EST) cats.forEach((c, i) => {
    const l = series.map(se => { const p = se.pts.find(p => p.i === i); return p ? '<b style="color:' + se.cor + '">■</b> ' + esc(se.nome) + ': ' + n0(p.v) + ' km/h' : ''; }).filter(Boolean).join('<br>');
    s += '<rect class="hit" x="' + (m.l + bw * i).toFixed(1) + '" y="' + m.t + '" width="' + bw.toFixed(1) + '" height="' + ph + '" fill="transparent"' + dv('dias', c.k) +
      ' data-tip="' + ('<b>' + dBR(c.k) + ' (' + dow(c.k) + ')</b><br>' + (l || 'Sem percursos')).replace(/"/g, '&quot;') + '"/>';
  });
  s += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + Y(limite).toFixed(1) + '" y2="' + Y(limite).toFixed(1) + '" stroke="#FF6B6B" stroke-width="1.6" stroke-dasharray="6 4"/>';
  s += '<text x="' + (W - m.r - 2) + '" y="' + (Y(limite) - 5).toFixed(1) + '" text-anchor="end" fill="#FF9A9A" font-size="11" font-weight="700" font-family="Segoe UI,Arial,sans-serif">Limite ' + limite + ' km/h</text>';
  series.forEach(se => {
    if (se.pts.length > 1) s += '<polyline fill="none" stroke="' + se.cor + '" stroke-width="1.6" stroke-opacity=".7" points="' + se.pts.map(p => X(p.i).toFixed(1) + ',' + Y(p.v).toFixed(1)).join(' ') + '"/>';
    se.pts.forEach(p => {
      const acima = p.v > limite, k = cats[p.i].k;
      s += '<circle class="' + cl('dias', k) + '" cx="' + X(p.i).toFixed(1) + '" cy="' + Y(p.v).toFixed(1) + '" r="' + (acima ? 4.2 : 3.2) + '" fill="' + (acima ? '#FF4D4D' : se.cor) + '" stroke="#031244" stroke-width="1.2"' + dv('dias', k) + ' data-tip="<b>' + esc(se.nome) + '</b><br>' + dBR(k) + ' (' + dow(k) + ')<br>Velocidade máxima: <b>' + n0(p.v) + ' km/h</b>' + (acima ? '<br><span style=&quot;color:#FF9A9A&quot;>acima do limite (+' + n0(p.v - limite) + ' km/h)</span>' : '') + '"/>';
    });
  });
  el.innerHTML = s + '</svg>';
}

function barrasH(el, itens, fmt) {
  if (!itens.length) { el.innerHTML = '<div class="vazio">Sem dados no filtro atual.</div>'; return; }
  const max = Math.max.apply(null, itens.map(i => i.v).concat([1]));

    Math.max(1.5, i.v / max * 100).toFixed(1) + '%;background:' + i.cor + '"></div></div><div class="hb-v">' + fmt(i.v) + '</div></div>').join('');
}

function mapaDias(el, c) {
  const datas = (S.ini && S.fim) ? intervalo(S.ini, S.fim) : [];
  if (!datas.length || !c.placas.length) { el.innerHTML = '<div class="vazio">Sem dados no filtro atual.</div>'; return; }
  const idx = new Map(); c.dias.forEach(d => idx.set(d.placa + '|' + d.data, d));
  const excPorDia = new Set(c.exc.map(e => e.placa + '|' + e.data));
  const maxKm = Math.max.apply(null, c.dias.map(d => d.km || 0).concat([1]));
  const curto = EST && datas.length > 40;
  let h = '<div class="mapa-grade" style="grid-template-columns:' + (EST ? '150px' : '170px') + ' repeat(' + datas.length + ',' + (EST ? 'minmax(0,1fr)' : 'minmax(22px,1fr)') + ')"><div></div>';
  datas.forEach(d => { h += '<div class="d ' + cl('dias', d) + '"' + dv('dias', d) + '><b>' + d.slice(8, 10) + '</b>' + (curto ? '' : dow(d)) + '</div>'; });
  c.placas.forEach(p => {
    h += '<div class="r ' + cl('placas', p) + '"' + dv('placas', p) + '>' + esc(apel(p)) + '<small>' + esc(subVeic(p)) + '</small></div>';
    datas.forEach(d => {
      const x = idx.get(p + '|' + d), cab = '<b>' + esc(txtVeic(p)) + ' · ' + dBR(d) + ' (' + dow(d) + ')</b><br>', k = clCel(p, d), a = dv('cell', p + '|' + d);
      if (!x) {
        h += '<div class="c sem ' + k + '"' + a + ' data-tip="' + esc(cab + (c.uM ? 'Sem percursos do(s) motorista(s) selecionado(s)' : comDados(p) ? 'Sem relatório para este dia' : 'Veículo sem relatório importado')) + '"></div>';
      } else if (x.situacao === 'parado') {
        const vm = velMinDia(p, d);
        h += '<div class="c par ' + k + '"' + a + ' data-tip="' + esc(cab + 'Parado: nenhum ponto no relatório' + (vm != null ? ' (relatório lista apenas velocidade ≥ ' + vm + ' km/h)' : '')) + '"></div>';
      } else {
        const al = (.38 + .62 * (x.km || 0) / maxKm).toFixed(2), ex = excPorDia.has(p + '|' + d);
        h += '<div class="c rod' + (ex ? ' exc' : '') + ' ' + k + '"' + a + ' style="background:rgba(255,160,43,' + al + ')" data-tip="' + esc(cab + 'Rodou: ' + n0(x.km) + ' km · ' + x.trips + ' percurso(s)<br>Vel. máx.: ' + n0(x.vel_max) + ' km/h' +
          (x.exc ? '<br><span style="color:#FF9A9A">' + x.exc + ' ponto(s) acima de ' + LIM + ' km/h</span>' : '') + '<br>Motorista: ' + x.mots.join(', ')) + '"></div>';
      }
    });
  });
  el.innerHTML = h + '</div>';
}



/* ============================================================ tabelas */
const TB = {};
function montaTabela(cont, id, cols, rows, opt) {
  opt = opt || {};
  const st = TB[id] || (TB[id] = {sort: opt.ordem || null, dir: opt.dir || 1, pag: 0, q: ''});
  const TAM = opt.tam || 50;
  cont.innerHTML = '<div class="barra-tab">' + (opt.busca === false ? '' : '<input type="search" placeholder="Buscar na tabela..." value="' + esc(st.q) + '">') +
    '<button class="exporta" type="button">⬇ Exportar CSV</button><span class="info"></span></div><div class="tabela-wrap"></div><div class="pager"></div>';
  const wrap = cont.querySelector('.tabela-wrap'), pager = cont.querySelector('.pager'), info = cont.querySelector('.info');
  const valor = (c, r) => c.v ? c.v(r) : r[c.k];
  const texto = (c, r) => { const v = c.csv ? c.csv(r) : valor(c, r); return v == null ? '' : v; };

  function visiveis() {
    let l = rows;
    if (st.q) { const q = st.q.toLowerCase(); l = l.filter(r => cols.some(c => String(texto(c, r)).toLowerCase().includes(q))); }
    if (st.sort != null) {
      const c = cols.find(c => c.k === st.sort);
      if (c) l = l.slice().sort((a, b) => {
        const x = valor(c, a), y = valor(c, b);
        if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
        return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'pt-BR', {numeric: true})) * st.dir;
      });
    }
    return l;
  }
  function desenha() {
    const l = visiveis(), pags = Math.max(1, Math.ceil(l.length / TAM));
    st.pag = Math.min(st.pag, pags - 1);
    const pedaco = l.slice(st.pag * TAM, st.pag * TAM + TAM);
    let h = '<table><thead><tr>' + cols.map(c => '<th class="' + (c.a === 'r' ? 'r' : '') + '" data-k="' + c.k + '">' + c.t +
      (st.sort === c.k ? '<span class="seta">' + (st.dir > 0 ? '▲' : '▼') + '</span>' : '') + '</th>').join('') + '</tr></thead><tbody>';
    if (!pedaco.length) h += '<tr><td colspan="' + cols.length + '" style="text-align:center;padding:22px;color:#C9D6F2">Nenhum registro no filtro atual.</td></tr>';
    pedaco.forEach((r, ri) => {
      const cls = [opt.classe ? opt.classe(r) : '', opt.aoClicar ? 'clicavel' : '', opt.sel && opt.sel(r) ? 'sel' : ''].filter(Boolean).join(' ');
      h += '<tr' + (cls ? ' class="' + cls + '"' : '') + ' data-ri="' + ri + '">' + cols.map(c => '<td class="' + (c.a === 'r' ? 'r ' : '') + (c.q ? 'quebra' : '') + '">' + (c.f ? c.f(r) : esc(valor(c, r) == null ? '—' : valor(c, r))) + '</td>').join('') + '</tr>';
    });
    wrap.innerHTML = h + '</tbody></table>';
    info.textContent = l.length === rows.length ? n0(rows.length) + ' registro(s)' : n0(l.length) + ' de ' + n0(rows.length) + ' registro(s)';
    pager.innerHTML = pags > 1 ? '<button type="button" data-p="-1"' + (st.pag === 0 ? ' disabled' : '') + '>‹ Anterior</button><span>Página ' + (st.pag + 1) + ' de ' + pags +
      '</span><button type="button" data-p="1"' + (st.pag >= pags - 1 ? ' disabled' : '') + '>Próxima ›</button>' : '';
    if (opt.aoClicar) wrap.querySelectorAll('tbody tr[data-ri]').forEach(tr => tr.onclick = ev => opt.aoClicar(pedaco[+tr.getAttribute('data-ri')], ev.ctrlKey || ev.shiftKey || ev.metaKey));
    wrap.querySelectorAll('th').forEach(th => th.onclick = () => {
      const k = th.getAttribute('data-k');
      if (st.sort === k) st.dir *= -1; else { st.sort = k; st.dir = 1; }
      desenha();
    });
    pager.querySelectorAll('button').forEach(b => b.onclick = () => { st.pag += +b.getAttribute('data-p'); desenha(); });
  }
  const busca = cont.querySelector('input');
  if (busca) busca.oninput = () => { st.q = busca.value; st.pag = 0; desenha(); };
  cont.querySelector('.exporta').onclick = () => {
    const l = visiveis();
    const cel = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const csv = '\ufeff' + [cols.map(c => cel(c.t.replace(/<[^>]+>/g, ''))).join(';')].concat(l.map(r => cols.map(c => cel(texto(c, r))).join(';'))).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv;charset=utf-8'}));
    a.download = (opt.arquivo || id) + '.csv'; document.body.appendChild(a); a.click(); a.remove();
  };
  desenha();
}


/* ============================================================ componentes de tela */
function cartoes(c) {

  const nVeic = c.porVeic.size ? Array.from(c.porVeic.values()).filter(g => g.trips > 0).length : 0;
  const ident = Array.from(c.porMot.keys()).filter(k => k !== NAO).length;
  const semMot = c.porMot.get(NAO) ? c.porMot.get(NAO).trips : 0;
  const inc = {alta: 0, 'média': 0, informativa: 0}; c.incons.forEach(i => inc[i.gravidade]++);
  const aqOk = D.arquivos.filter(a => a.status === 'ok').length, aqErr = D.arquivos.filter(a => a.status === 'erro').length;
  const kmNulo = c.trips.filter(t => t.km == null).length;
  const L = [
    ['#FFA02B', 'Km percorridos', n0(c.km) + ' <small>km</small>', c.trips.length + ' percurso(s)' + (kmNulo ? ' · ' + kmNulo + ' sem hodômetro' : ''), 'percursos'],

    ['#FFD27A', 'Dias rodados', n0(c.diasRod.length), c.uM ? 'dias de percurso do(s) motorista(s)' : 'Parados: ' + n0(c.diasPar.length) + ' (veículo-dia)', 'dias'],
    ['#A5B4FC', 'Percursos', n0(c.trips.length), 'pausa > ' + D.config.intervalo_entre_percursos_min + ' min inicia novo percurso', 'percursos'],

/* Desenha os 5 gráficos dentro de "raiz". est=true: versão do relatório PDF (todos usam o filtro completo, sem interação). */
function desenhaVisao(raiz, est, altura) {
  EST = !!est;
  try {
    const q = s => raiz.querySelector(s);
    const cD = est ? C : calc(['dias']), cV = est ? C : calc(['placas']), cM = est ? C : calc(['mots']), cMap = est ? C : calc(['placas', 'dias']);
    const dias = (S.ini && S.fim) ? intervalo(S.ini, S.fim) : [];
    const cats = dias.map(d => ({k: d, l: dCurta(d)}));
    const kmDia = {}, vmDia = {};
    cD.trips.forEach(t => {
      const a = (kmDia[t.placa] = kmDia[t.placa] || {}); a[t.data] = (a[t.data] || 0) + (t.km || 0);
      const b = (vmDia[t.placa] = vmDia[t.placa] || {}); b[t.data] = Math.max(b[t.data] || 0, t.vel_max || 0);
    });
    const serie = cD.placas.map(p => ({p: p, nome: apel(p), cor: corVeic[p]}));
    if (q('.g-leg1')) q('.g-leg1').innerHTML = legenda(cV.placas);
    if (q('.g-leg2')) q('.g-leg2').innerHTML = legenda(cV.placas);
    if (!cats.length) { q('.g-km').innerHTML = q('.g-vel').innerHTML = '<div class="vazio">Sem dados.</div>'; }
    else {
      graficoBarras(q('.g-km'), cats, serie.map(s => ({nome: s.nome, cor: s.cor, v: dias.map(d => (kmDia[s.p] || {})[d] || 0)})), {titulo: 'Km por dia', h: est ? 290 : altura});
      graficoLinhas(q('.g-vel'), cats, serie.map(s => ({nome: s.nome, cor: s.cor, pts: dias.map((d, i) => ({i: i, v: (vmDia[s.p] || {})[d]})).filter(p => p.v != null)})), LIM, {titulo: 'Velocidade máxima por dia', h: altura});
    }
    const veic = Array.from(cV.porVeic.values()).sort((a, b) => b.km - a.km || apel(a.nome).localeCompare(apel(b.nome), 'pt-BR')).map(g => ({dim: 'placas', val: g.nome, l: apel(g.nome),
      lh: '<b>' + esc(apel(g.nome)) + '</b><small>' + esc(subVeic(g.nome)) + '</small>', v: g.km, cor: corVeic[g.nome],
      tip: g.trips ? g.trips + ' percurso(s)' : (comDados(g.nome) ? 'Sem percursos no filtro' : 'Sem relatório importado')}));
    barrasH(q('.g-veic'), veic, v => n0(v) + ' km');
    const mots = Array.from(cM.porMot.values()).sort((a, b) => b.km - a.km).map(g => ({dim: 'mots', val: g.nome, l: g.nome,
      lh: g.nome === NAO ? '<span class="tag nid">' + esc(NAO) + '</span>' : '<b>' + esc(g.nome) + '</b>', v: g.km, cor: g.nome === NAO ? '#94A3B8' : '#2DD4BF', tip: g.trips + ' percurso(s)'}));
    barrasH(q('.g-mot'), mots, v => n0(v) + ' km');
    mapaDias(q('.g-mapa'), cMap);
  } finally { EST = false; }
}

    {k: 'gp', t: 'GPS não válido', a: 'r', v: r => r.gps_nao_valido, f: r => flag(r.gps_nao_valido, true)},
    {k: 'ig', t: 'Ign. desligada c/ veloc.', a: 'r', v: r => r.ign_desligada_com_velocidade, f: r => flag(r.ign_desligada_com_velocidade, true)},
    {k: 'se', t: 'Sem endereço', a: 'r', v: r => r.sem_endereco, f: r => flag(r.sem_endereco, true)},
    {k: 'hz', t: 'Horím. sem variação', v: r => r.horimetro_sem_variacao, f: r => r.horimetro_sem_variacao ? '<span class="tag alerta">sim</span>' : 'não', csv: r => r.horimetro_sem_variacao ? 'sim' : 'não'},
  ];
  const linhasQ = placas.filter(p => q[p]).map(p => Object.assign({placa: p}, q[p]));
  const mins = Object.keys(D.cobertura).map(p => p + ': ' + Array.from(new Set(D.cobertura[p].map(x => x.vel_min == null ? '?' : x.vel_min))).join('/') + ' km/h').join(' · ');
  APP.querySelector('#conteudo').innerHTML =
    '<div class="glass painel" style="margin-bottom:14px"><h2>Possíveis inconsistências</h2><div class="dica">Detectadas automaticamente a partir dos registros. Respeitam os filtros de veículo e período.</div><div id="t_i"></div></div>' +
    '<div class="glass painel" style="margin-bottom:14px"><h2>Dados ausentes por veículo</h2><div class="dica">Contagem de registros do histórico (todo o período importado). Destaque = há ocorrências.</div><div id="t_q"></div></div>' +
    '<div class="glass painel"><h2>Como interpretar os dados</h2><ul class="bloco-notas">' +
    '<li><b>Velocidade mínima do relatório:</b> o relatório do rastreador só lista pontos com velocidade igual ou acima de um mínimo escolhido na exportação (' + esc(mins || 'não informado') + '). Pontos mais lentos não existem no PDF; por isso a velocidade média considera apenas os pontos listados e “parado” significa “sem pontos no relatório”.</li>' +
    '<li><b>Hodômetro:</b> o PDF não informa a unidade. Foi tratado como km: a soma de velocidade × tempo entre pontos próximos fica coerente com a variação do hodômetro. Como o valor é inteiro, cada percurso tem precisão de cerca de ±1 km.</li>' +
    '<li><b>Motorista:</b> vem da coluna “Motorista” do relatório. Se estiver vazia, aparece “' + esc(NAO) + '”. ' + (D.escala_manual ? 'Há uma escala manual em config/motoristas.csv sendo usada para preencher os dias informados.' : 'Opcionalmente, você pode informar uma escala em config/motoristas.csv (veja o LEIA-ME).') + '</li>' +
    '<li><b>Linhas “BUZZER”:</b> a coluna “Saída” do relatório marca BUZZER (saída do rastreador acionada), muitas vezes como uma linha adicional no mesmo segundo da posição. As estatísticas juntam as linhas do mesmo horário (média para a velocidade média; maior valor para a máxima). O BUZZER <b>não</b> equivale ao limite do painel: nos relatórios de exemplo ele aparece em velocidades variadas (de 78 a 154 km/h) e muitos pontos acima do limite não têm BUZZER; por isso o painel usa o limite configurado em config.json.</li>' +
    '<li><b>Apelidos dos veículos:</b> vêm do arquivo config/veiculos.csv (colunas placa;apelido;modelo), informado por você. Placa e modelo seguem esse cadastro; os demais dados vêm só dos PDFs.</li></ul></div>';
  montaTabela(APP.querySelector('#t_i'), 'i', colsI, c.incons, {ordem: 'g', dir: 1, arquivo: 'inconsistencias'});
  montaTabela(APP.querySelector('#t_q'), 'q', colsQ, linhasQ, {busca: false, arquivo: 'dados_ausentes'});
}

function abaArquivos() {
  const cols = [
    {k: 'nome', t: 'Arquivo', v: r => r.nome, f: r => '<b>' + esc(r.nome) + '</b>' + (r.presente ? '' : ' <span class="tag info" title="O dado importado continua guardado">removido da pasta</span>')},
    {k: 'imp', t: 'Importado em', v: r => r.importado_em, f: r => dtBR(r.importado_em), csv: r => dtBR(r.importado_em)},
    {k: 'st', t: 'Status', v: r => r.status, f: r => r.status === 'ok' ? '<span class="tag ok">OK</span>' : '<span class="tag erro">ERRO</span>', csv: r => r.status === 'ok' ? 'OK' : 'ERRO'},
    {k: 've', t: 'Veículo(s)', v: r => r.placas.join(', '), f: r => r.placas.length ? esc(r.placas.map(txtVeic).join(', ')) : '—', csv: r => r.placas.map(txtVeic).join(', ')},
    {k: 'per', t: 'Período', v: r => r.periodo_ini, f: r => r.periodo_ini ? dBR(r.periodo_ini) + ' a ' + dBR(r.periodo_fim) : '—', csv: r => r.periodo_ini ? dBR(r.periodo_ini) + ' a ' + dBR(r.periodo_fim) : ''},
    {k: 'vm', t: 'Vel. mín.', a: 'r', v: r => r.vel_min, f: r => r.vel_min == null ? '—' : r.vel_min + ' km/h'},
    {k: 'pg', t: 'Páginas', a: 'r', v: r => r.paginas, f: r => n0(r.paginas)},
    {k: 'll', t: 'Linhas lidas', a: 'r', v: r => r.linhas_lidas, f: r => n0(r.linhas_lidas)},
    {k: 'ln', t: 'Novas', a: 'r', v: r => r.linhas_novas, f: r => n0(r.linhas_novas)},
    {k: 'ld', t: 'Duplicadas', a: 'r', v: r => r.linhas_duplicadas, f: r => r.linhas_duplicadas ? '<span class="tag alerta">' + n0(r.linhas_duplicadas) + '</span>' : '0'},
    {k: 'av', t: 'Erros / avisos', q: true, v: r => (r.erro ? r.erro : r.avisos.join(' ')), f: r => r.erro ? '<span style="color:#FFB3B3"><b>' + esc(r.erro) + '</b></span>' : (r.avisos.length ? esc(r.avisos.join(' ')) : '—'), csv: r => r.erro || r.avisos.join(' ')},
  ];
  const rep = [
    {k: 'q', t: 'Detectado em', v: r => r.quando, f: r => dtBR(r.quando), csv: r => dtBR(r.quando)},
    {k: 'n', t: 'Arquivo repetido', v: r => r.nome, f: r => '<b>' + esc(r.nome) + '</b>'},
    {k: 'i', t: 'Igual a', v: r => r.igual_a, f: r => esc(r.igual_a)},
  ];
  const erros = D.erros.filter(e => e.presente);
  APP.querySelector('#conteudo').innerHTML =
    (erros.length ? '<div class="aviso erro" style="margin-bottom:14px"><span class="ic">⚠</span><div><b>' + erros.length + ' arquivo(s) não puderam ser lidos</b> — os dados já importados foram preservados:<ul style="margin:6px 0 0 18px;padding:0">' +
      erros.map(e => '<li><b>' + esc(e.nome) + '</b>: ' + esc(e.erro) + '</li>').join('') + '</ul></div></div>' : '') +
    '<div class="glass painel" style="margin-bottom:14px"><h2>Arquivos processados</h2><div class="dica">Histórico de tudo que foi lido. Cada PDF é importado uma única vez (identificado pelo conteúdo, mesmo se for renomeado). Registros duplicados entre relatórios são descartados.</div><div id="t_ar"></div></div>' +
    '<div class="glass painel"><h2>Arquivos repetidos ignorados</h2><div class="dica">Cópias de PDFs já importados que foram encontradas na pasta.</div>' + (D.repetidos.length ? '<div id="t_rep"></div>' : '<div class="vazio" style="padding:14px">Nenhum arquivo repetido até agora.</div>') + '</div>';
  montaTabela(APP.querySelector('#t_ar'), 'ar', cols, D.arquivos, {ordem: 'imp', dir: -1, arquivo: 'arquivos_processados', classe: r => r.status === 'erro' ? 'erro' : ''});
  if (D.repetidos.length) montaTabela(APP.querySelector('#t_rep'), 'rep', rep, D.repetidos, {busca: false, arquivo: 'arquivos_repetidos'});
}

function avisosTopo(c) {
  const L = [];
  const erros = D.erros.filter(e => e.presente);
  if (erros.length) L.push(['erro', '⚠', '<b>' + erros.length + ' PDF(s) não puderam ser lidos:</b> ' + erros.map(e => esc(e.nome)).join(', ') + '. Os dados já importados foram preservados. <a data-aba="arquivos">Ver detalhes</a>']);
  const allTrips = D.percursos.length, nid = D.percursos.filter(t => !t.motorista).length;
  if (allTrips && nid) L.push(['alerta', '●', '<b>Motorista não identificado</b> em ' + Math.round(nid / allTrips * 100) + '% dos percursos: a coluna “Motorista” do relatório está vazia. Os quilômetros por motorista só serão separados quando o relatório trouxer o motorista (ou se você informar uma escala). <a data-aba="qualidade">Como resolver</a>']);
  (D.problemas_escala || []).forEach(p => L.push(['alerta', '●', esc(p)]));
  const ng = c.incons.filter(i => i.gravidade !== 'informativa').length;
  if (ng) L.push(['alerta', '●', '<b>' + ng + ' inconsistência(s) de gravidade alta/média</b> encontradas. <a data-aba="qualidade">Ver</a>']);
  const sem = D.veiculos.filter(v => !v.com_dados);
  if (sem.length) L.push(['info', 'ℹ', '<b>' + sem.map(v => esc(apel(v.placa))).join(', ') + '</b>: cadastrado(s) em config/veiculos.csv, mas ainda sem relatório PDF importado.']);
  if (!D.percursos.length && !D.arquivos.length) L.push(['info', 'ℹ', 'Ainda não há relatórios importados. Coloque PDFs na pasta <b>pdf_veiculos</b> e execute <b>ATUALIZAR_E_ABRIR.bat</b>.']);
  return L.length ? '<div class="avisos">' + L.map(a => '<div class="aviso ' + a[0] + '"><span class="ic">' + a[1] + '</span><div>' + a[2] + '</div></div>').join('') + '</div>' : '';
}

function lateral() {
  const op = (f, val, on, dot, titulo, sub, extra) => '<label class="op' + (on ? ' on' : '') + (extra ? ' semdados' : '') + '"><input type="checkbox" data-f="' + f + '" value="' + esc(val) + '"' + (on ? ' checked' : '') + '>' +
    (dot ? '<i style="background:' + dot + '"></i>' : '') + '<span class="tx"><b>' + titulo + '</b>' + (sub ? '<small>' + sub + '</small>' : '') + '</span>' + (extra ? '<em>' + extra + '</em>' : '') + '</label>';
  const vs = D.veiculos.map(v => op('placas', v.placa, S.placas.has(v.placa), corVeic[v.placa], esc(apel(v.placa)), esc(subVeic(v.placa)), v.com_dados ? '' : 'sem PDF')).join('');
  const ms = motoristas.length ? motoristas.map(m => op('mots', m, S.mots.has(m), m === NAO ? '#94A3B8' : '#2DD4BF', esc(m), '', '')).join('') : '<div class="mut">Nenhum percurso importado.</div>';
  const dsel = Array.from(S.dias).sort();
  const tem = nFiltros() > 0 || S.ini !== DATA_MIN || S.fim !== DATA_MAX;
  return '<aside class="glass lateral"><div class="lat-cab"><h3>Filtros</h3><button type="button" class="chip limpar" data-act="limpar"' + (tem ? '' : ' disabled') + '>Limpar tudo</button></div>' +
    '<div class="lat-bloco"><div class="lat-t">Período</div><div class="duas"><label>De<input type="date" id="f_i" value="' + (S.ini || '') + '" min="' + (DATA_MIN || '') + '" max="' + (DATA_MAX || '') + '"></label>' +
    '<label>Até<input type="date" id="f_f" value="' + (S.fim || '') + '" min="' + (DATA_MIN || '') + '" max="' + (DATA_MAX || '') + '"></label></div>' +
    '<div class="chips" style="margin-top:8px"><button type="button" class="chip" data-p="tudo">Tudo</button><button type="button" class="chip" data-p="7">7 dias</button><button type="button" class="chip" data-p="30">30 dias</button></div></div>' +
    '<div class="lat-bloco"><div class="lat-t">Veículos <span>' + (S.placas.size ? S.placas.size + ' selecionado(s)' : 'todos') + '</span></div><div class="lista">' + vs + '</div></div>' +
    '<div class="lat-bloco"><div class="lat-t">Motoristas <span>' + (S.mots.size ? S.mots.size + ' selecionado(s)' : 'todos') + '</span></div><div class="lista">' + ms + '</div></div>' +
    (dsel.length ? '<div class="lat-bloco"><div class="lat-t">Dias selecionados</div><div class="chips">' + dsel.map(d => '<button type="button" class="chip-dia" data-rm="' + d + '" title="Remover">' + dCurta(d) + ' ' + dow(d) + ' ✕</button>').join('') + '</div></div>' : '') +
    '<button type="button" class="btn-pdf" data-act="pdf">📄 Gerar PDF do dashboard</button>' +
    '<div class="dica-lat">O PDF reproduz o painel com os filtros aplicados agora. Na janela que abrir, escolha <b>Salvar como PDF</b>.</div>' +
    '<div class="lat-lim">Limite de velocidade<br><b>' + LIM + ' km/h</b></div></aside>';
}

const ABAS = [['geral', 'Visão geral'], ['resumos', 'Veículos e motoristas'], ['percursos', 'Percursos'], ['dias', 'Dias por veículo'], ['alertas', 'Alertas de velocidade'], ['qualidade', 'Qualidade dos dados'], ['arquivos', 'Arquivos']];
let C = null;
function abas() {
  const n = {alertas: C.exc.length, qualidade: C.incons.length, percursos: C.trips.length};
  const err = D.erros.filter(e => e.presente).length;
  return '<nav class="abas" role="tablist">' + ABAS.map(a => '<button type="button" role="tab" class="aba' + (S.aba === a[0] ? ' ativa' : '') + '" data-aba="' + a[0] + '">' + a[1] +
    (n[a[0]] != null ? '<span class="n">' + n[a[0]] + '</span>' : '') + (a[0] === 'arquivos' && err ? '<span class="n" style="background:#FF6B6B;color:#fff">' + err + '</span>' : '') + '</button>').join('') + '</nav>';
}

function render() {
  const rolagem = window.scrollY, lat = APP.querySelector('.lateral'), rl = lat ? lat.scrollTop : 0, listas = Array.from(APP.querySelectorAll('.lateral .lista')).map(l => l.scrollTop);
  C = calc();
  APP.innerHTML = lateral() + '<main class="principal">' + cabecalho() + avisosTopo(C) + cartoes(C) + abas() + '<div id="conteudo"></div>' +
    '<div class="rodape">Sistema de Controle de Veículos e Motoristas · PIAU Service Soluções Ltda · dados 100% extraídos dos relatórios PDF importados</div></main>';
  ({geral: abaGeral, resumos: abaResumos, percursos: abaPercursos, dias: abaDias, alertas: abaAlertas, qualidade: abaQualidade, arquivos: abaArquivos})[S.aba](C);
  const l2 = APP.querySelector('.lateral'); if (l2) { l2.scrollTop = rl; APP.querySelectorAll('.lateral .lista').forEach((l, i) => { l.scrollTop = listas[i] || 0; }); }
  window.scrollTo(0, rolagem);
}

function limpaTudo() { S.placas.clear(); S.mots.clear(); S.dias.clear(); S.ini = DATA_MIN; S.fim = DATA_MAX; S.diasMostrar = 'todos'; }

APP.addEventListener('click', e => {
  const el = e.target.closest('[data-dim]');
  if (el) {
    const dim = el.getAttribute('data-dim'), val = el.getAttribute('data-val'), multi = e.ctrlKey || e.shiftKey || e.metaKey;
    if (dim === 'cell') {
      const a = val.split('|'), p = a[0], d = a[1];
      if (S.placas.size === 1 && S.placas.has(p) && S.dias.size === 1 && S.dias.has(d)) { S.placas.clear(); S.dias.clear(); }
      else if (multi) { S.placas.add(p); S.dias.add(d); }
      else { S.placas.clear(); S.dias.clear(); S.placas.add(p); S.dias.add(d); }
    } else alterna(S[dim], val, multi);
    render(); return;
  }
  const rm = e.target.closest('[data-rm]');
  if (rm) { S.dias.delete(rm.getAttribute('data-rm')); render(); return; }
  const act = e.target.closest('[data-act]');
  if (act) { const a = act.getAttribute('data-act'); if (a === 'limpar') { limpaTudo(); render(); } else if (a === 'pdf') gerarPDF(); return; }
  const p = e.target.closest('[data-p]');
  if (p && p.classList.contains('chip') && !p.hasAttribute('data-dm')) {
    const v = p.getAttribute('data-p');
    if (v === 'tudo') { S.ini = DATA_MIN; S.fim = DATA_MAX; }
    else { S.fim = DATA_MAX; S.ini = addDias(DATA_MAX, -(+v - 1)); if (S.ini < DATA_MIN) S.ini = DATA_MIN; }
    render(); return;
  }
  const dm = e.target.closest('[data-dm]');
  if (dm) { S.diasMostrar = dm.getAttribute('data-dm'); render(); return; }
  const ab = e.target.closest('[data-aba]');
  if (ab) { S.aba = ab.getAttribute('data-aba'); render(); window.scrollTo(0, 0); }
});
APP.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('input[data-f]')) { const s = S[t.getAttribute('data-f')], v = t.value; if (t.checked) s.add(v); else s.delete(v); render(); }
  else if (t.id === 'f_i' || t.id === 'f_f') {
    let a = APP.querySelector('#f_i').value || DATA_MIN, b = APP.querySelector('#f_f').value || DATA_MAX;
    if (a > b) { const x = a; a = b; b = x; }
    S.ini = a; S.fim = b; render();
  }
});

function tabEst(cols, rows) {
  return '<table class="est"><thead><tr>' + cols.map(c => '<th class="' + (c.a === 'r' ? 'r' : '') + '">' + c.t + '</th>').join('') + '</tr></thead><tbody>' +
    (rows.length ? rows.map(r => '<tr>' + cols.map(c => '<td class="' + (c.a === 'r' ? 'r' : '') + '">' + (c.f ? c.f(r) : esc((c.v ? c.v(r) : r[c.k]) == null ? '—' : (c.v ? c.v(r) : r[c.k]))) + '</td>').join('') + '</tr>').join('') : '<tr><td colspan="' + cols.length + '" style="text-align:center">Sem dados no filtro atual.</td></tr>') + '</tbody></table>';
}

(function () {

<div id="cmp"><div class="mn" id="cmn">
<a id="cw" target="_blank" rel="noopener">&#128172; Enviar por WhatsApp</a>
<a id="ce">&#9993; Enviar por e-mail</a>
<button id="cc" type="button">&#128203; Copiar link</button>
<div class="av">O link não leva a senha. Passe a senha à parte.</div></div>
<button class="bt" id="cb" type="button">&#128279; Compartilhar link</button></div>
<script>
(function () {
  var box = document.getElementById('cmp'), cb = document.getElementById('cb'), app = document.getElementById('app');
  function link() { return location.href.split('#')[0].split('?')[0]; }
  var msg = 'Painel de Controle de Veículos e Motoristas - PIAU: ';
  document.getElementById('cw').addEventListener('click', function () { this.href = 'https://wa.me/?text=' + encodeURIComponent(msg + link()); });
  document.getElementById('ce').addEventListener('click', function () { this.href = 'mailto:?subject=' + encodeURIComponent('Painel de Veículos - PIAU') + '&body=' + encodeURIComponent(msg + link()); });
  document.getElementById('cc').addEventListener('click', function () {
    var b = this, ok = function () { b.textContent = '✅ Link copiado!'; setTimeout(function () { b.innerHTML = '&#128203; Copiar link'; }, 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link()).then(ok, function () { prompt('Copie o link:', link()); });
    else prompt('Copie o link:', link());
  });
  cb.addEventListener('click', function () { box.classList.toggle('aberto'); });
  document.addEventListener('click', function (e) { if (!box.contains(e.target)) box.classList.remove('aberto'); });
  function confere() { box.style.display = (app && app.style.display !== 'none') ? 'block' : 'none'; }
  if (app) { new MutationObserver(confere).observe(app, {attributes: true, attributeFilter: ['style']}); }
  confere();
})();
</script>

</body>
</html>
